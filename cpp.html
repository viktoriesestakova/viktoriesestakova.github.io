<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Kodaň | Viktorie Šestáková</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .main-card {
            background: white;
            max-width: 1000px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .button-group {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-outline {
            border: 2px solid #007bff;
            color: #007bff;
        }
        .btn-outline:hover {
            background-color: #007bff;
            color: white;
        }
        .pdf-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            height: 700px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>Moje budoucí studium v Kodani</h1>
        
        <p>Prohlédněte si můj projekt o Kodani a plány na studium na CBS.</p>

        <div class="button-group">
            <a href="https://www.cbs.dk/" target="_blank" class="btn btn-outline">
                Oficiální web CBS (Dánsko)
            </a>

            <a href="kodan.pdf" target="_blank" class="btn btn-primary">
                Otevřít PDF na celé obrazovce
            </a>
        </div>

        <div class="pdf-container">
            <iframe src="kodan.pdf">
                Váš prohlížeč nepodporuje zobrazování PDF. 
                <a href="kodan.pdf">Klikněte zde pro stažení.</a>
            </iframe>
        </div>

        <p style="margin-top: 20px;">
            <a href="index.html" style="color: #666;">← Zpět na domovskou stránku</a>
        </p>
    </div>

</body>
</html>
