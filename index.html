<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Moje Stránka</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #333; margin-bottom: 20px; }
        p { color: #666; line-height: 1.6; }
        .button { display: inline-block; margin-top: 25px; padding: 15px 30px; background: #007bff; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .button:hover { background: #0056b3; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vítejte! 👋</h1>
        <p>Tohle je moje nová webová vizitka. Vše důležité o mém projektu v Kodani najdete na další stránce.</p>
        <a href="kodan.html" class="button">Vstoupit do Kodaně →</a>
    </div>
</body>
</html>
