<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Moje Stránka</title>
    <style>
        /* Základní nastavení pro celou stránku (pozadí) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* Styl pro bílou kartu uprostřed */
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; /* Aby to vypadalo dobře i na mobilu */
        }

        /* Styl pro tvůj nahraný obrázek */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Udělá obrázek kulatý */
            object-fit: cover; /* Zajistí, že se obrázek nedeformuje */
            border: 5px solid #007bff; /* Modrý rámeček kolem */
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 { 
            color: #333; 
            margin-top: 0;
            margin-bottom: 15px; 
            font-size: 28px;
        }

        p { 
            color: #666; 
            line-height: 1.6; 
            margin-bottom: 30px;
        }

        /* Styl pro modré tlačítko */
        .button { 
            display: inline-block; 
            padding: 15px 35px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 6px rgba(0,123,255,0.3);
        }

        /* Efekt, když na tlačítko najedeš myší */
        .button:hover { 
            background: #0056b3; 
            transform: translateY(-3px); /* Tlačítko se trochu zvedne */
            box-shadow: 0 6px 12px rgba(0,123,255,0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="obrazek.jpeg" alt="Moje fotka" class="profile-img">
        
        <h1>Vítejte! 👋</h1>
        <p>Tohle je moje nová webová vizitka. Vše důležité o mém projektu v Kodani najdete na další stránce.</p>
        <a href="kodan.html" class="button">Vstoupit do Kodaně →</a>
    </div>
</body>
</html>
